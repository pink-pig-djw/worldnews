name: Debug - dump fetched data to log (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-data.mjs --out out
      - name: Dump
        run: |
          gzip -9 -c out/latest.json | base64 -w 4000 > dump.txt
          echo "DUMP-LINES $(wc -l < dump.txt)"
          sed 's/^/DUMP:/' dump.txt
          echo "DUMP-END"
