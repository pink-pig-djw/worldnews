name: Debug - probe GDELT API (temporary)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          Q='(domain:reuters.com OR domain:apnews.com OR domain:bbc.co.uk OR domain:aljazeera.com)'
          ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$Q")
          BASE="https://api.gdeltproject.org/api/v2/doc/doc?query=${ENC}&mode=artlist&maxrecords=5&timespan=1h&sort=datedesc"
          echo "== headers (json, with Origin)"; curl -sS -D - -o body.json -H "Origin: https://example.github.io" "${BASE}&format=json" | sed 's/^/H: /'
          echo "== body json"; head -c 1500 body.json; echo
          sleep 6
          echo "== jsonp callback="; curl -sS "${BASE}&format=jsonp&callback=cbTest" | head -c 300; echo
          sleep 6
          echo "== timespan 15min"; curl -sS "https://api.gdeltproject.org/api/v2/doc/doc?query=${ENC}&mode=artlist&maxrecords=3&timespan=15min&sort=datedesc&format=json" | head -c 600; echo
          sleep 6
          echo "== preflight-free GET from browser? (OPTIONS)"; curl -sS -X OPTIONS -D - -o /dev/null -H "Origin: https://example.github.io" -H "Access-Control-Request-Method: GET" "${BASE}&format=json" | sed 's/^/O: /'
          echo "== gdacs cors"; curl -sS -D - -o /dev/null -H "Origin: https://example.github.io" "https://www.gdacs.org/xml/rss.xml" | grep -i "access-control\|HTTP/" | sed 's/^/G: /'
          echo "== eonet cors"; curl -sS -D - -o /dev/null -H "Origin: https://example.github.io" "https://eonet.gsfc.nasa.gov/api/v3/events?limit=1" | grep -i "access-control\|HTTP/" | sed 's/^/E: /'
          echo "== usgs cors"; curl -sS -D - -o /dev/null -H "Origin: https://example.github.io" "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson" | grep -i "access-control\|HTTP/\|cache-control" | sed 's/^/U: /'
