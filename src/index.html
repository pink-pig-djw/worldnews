<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#020409" />
    <meta name="color-scheme" content="dark" />
    <title>全球脉动 · World Pulse</title>
    <meta name="description" content="实时 3D 地球：在地球上点击查看全球冲突、灾害、政治与经济新闻热点。Live 3D globe of world news, conflicts and hazards." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preload" href="data/latest.json" as="fetch" crossorigin />
    <link rel="stylesheet" href="app.css?v=__BUILD__" />
  </head>
  <body>
    <div id="app" class="app" data-tab="map">
      <div id="globe" class="globe-host" aria-label="3D globe"></div>
      <div class="vignette" aria-hidden="true"></div>

      <header class="topbar">
        <button class="brand glass" id="status-btn" type="button" aria-haspopup="dialog">
          <span class="live-dot" id="live-dot"></span>
          <span class="brand-text"><b data-i18n="brand">全球脉动</b><small data-i18n="brandSub">WORLD PULSE</small></span>
          <span class="brand-time" id="updated">—</span>
        </button>
        <div class="top-actions">
          <div class="clock glass" id="clock" aria-live="off"></div>
          <button class="icon-btn glass" id="search-btn" type="button"></button>
          <button class="icon-btn glass" id="tour-btn" type="button"></button>
          <button class="icon-btn glass" id="legend-btn" type="button"></button>
        </div>
      </header>

      <nav class="chips" id="cat-chips" aria-label="categories"></nav>

      <aside class="sidebar glass" id="sidebar" aria-label="panels">
        <div class="sheet-handle" data-sheet-handle></div>
        <div class="side-tabs" id="side-tabs" role="tablist"></div>
        <div class="side-body" id="side-body"></div>
      </aside>

      <section class="detail glass" id="detail" aria-live="polite" hidden>
        <div class="sheet-handle" data-sheet-handle></div>
        <div class="detail-head" id="detail-head"></div>
        <div class="detail-scroll" id="detail-body"></div>
      </section>

      <div class="ticker glass" id="ticker"></div>
      <nav class="tabbar glass" id="tabbar" role="tablist"></nav>

      <div class="search-overlay" id="search" hidden>
        <div class="search-box glass">
          <span class="search-ico"></span>
          <input id="search-input" type="search" autocomplete="off" spellcheck="false" />
          <button class="icon-btn ghost" id="search-close" type="button"></button>
        </div>
        <div class="search-results glass" id="search-results"></div>
      </div>

      <div class="popover glass" id="legend" hidden></div>
      <div class="popover glass" id="status-pop" hidden></div>
      <div class="tooltip glass" id="tooltip" hidden></div>
      <div class="toast" id="toast" role="status"></div>
      <div class="sample-banner" id="sample-banner" hidden></div>

      <div class="loader" id="loader">
        <div class="loader-orb"></div>
        <p id="loader-text">正在载入全球态势…</p>
      </div>
    </div>
    <noscript>此网站需要启用 JavaScript / This site needs JavaScript.</noscript>
    <script type="module" src="app.js?v=__BUILD__"></script>
  </body>
</html>
